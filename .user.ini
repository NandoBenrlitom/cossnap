; PHP 8.4 Custom Configuration for Azure App Service
; File ini dibaca oleh PHP-FPM secara otomatis

; Upload settings
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 10

; Memory & execution
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Error display (set ke Off di production)
display_errors = Off
log_errors = On

; Session
session.gc_maxlifetime = 3600
session.cookie_httponly = 1

; Date
date.timezone = Asia/Jakarta
